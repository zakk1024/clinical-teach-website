<!-- Source: DOI 10.1111/jocd.13743 (A9, Cannula versus needle in medical rhinoplasty, J Cosmet Dermatol 2020, secondary) -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 880 660" role="img">
  <g><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerWidth="9" markerHeight="9"><path d="M0,1 L10,5 L0,9 z" fill="#e8e8e8"/></marker><marker id="arwT" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerWidth="9" markerHeight="9"><path d="M0,1 L10,5 L0,9 z" fill="#4ecdc4"/></marker></defs><line x1="460" y1="100" x2="460" y2="430" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8"/><text x="230" y="110" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="19" fill="#4ecdc4" text-anchor="middle" font-weight="normal">鈍針／cannula：推開</text><path d="M 100,340 L 286,272" fill="none" stroke="#e8e8e8" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="296" cy="268" r="10" fill="none" stroke="#e8e8e8" stroke-width="3"/><path d="M 90,230 C 190,214 250,196 292,190 C 330,186 360,196 430,214" fill="none" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="316" y1="240" x2="302" y2="210" stroke="#ff6b6b" stroke-width="2.4" marker-end="url(#arw)"/><text x="230" y="170" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#ff6b6b" text-anchor="middle" font-weight="normal">血管壁被推開——不破</text><text x="660" y="110" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="19" fill="#ff6b6b" text-anchor="middle" font-weight="normal">尖針 sharp needle：穿入</text><path d="M 520,340 L 700,236" fill="none" stroke="#e8e8e8" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round"/><path d="M 700,236 L 726,222" fill="none" stroke="#e8e8e8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 490,214 C 570,206 660,222 730,244 C 770,256 800,262 830,264" fill="none" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="712" cy="230" r="12" fill="none" stroke="#ff6b6b" stroke-width="2.2" stroke-dasharray="4 4"/><line x1="760" y1="300" x2="726" y2="244" stroke="#ff6b6b" stroke-width="2.4" marker-end="url(#arw)"/><text x="700" y="330" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#ff6b6b" text-anchor="middle" font-weight="normal">血管壁被穿刺／切入</text><text x="60" y="450" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start" font-weight="normal">引用界線：thread 用鈍針／cannula，機轉不同（推開而非切開血管）——</text><text x="60" y="476" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start" font-weight="normal">不能把 filler 的失明風險數字直接搬給 thread 用，只能借解剖地圖（A12 裁決）。</text></g>
  <text x="20" y="604" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#e8e8e8">F10｜鈍針 vs 尖針通過血管的機轉對照：推開 vs 穿入。</text>
  <text x="20" y="630" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#e8e8e8">schematic／示意｜來源：DOI 10.1111/jocd.13743（A9，secondary）</text>
