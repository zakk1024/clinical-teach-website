  <text x="20" y="604" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#e8e8e8">F1｜鼻背危險區總覽：單條優勢型 DNA 可靠正中線 1–2 mm 內行走；插層須確認骨膜前層才算安全。</text>
